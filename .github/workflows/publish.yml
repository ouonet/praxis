name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Upgrade npm
        run: npm install -g npm@latest && npm -v   # 确保 ≥ 11.5.1

      - name: Run automated tests
        run: node --test test/cli.test.js test/invariants.test.js test/adapters.test.js

      - name: Publish to npmjs
        run: npm publish --access public
